<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
*{font-family:sans-serif;box-sizing:border-box}body{background:#0f172a;color:white;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;max-width:700px;margin:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{border:1px solid #334155;padding:6px}
button{padding:8px 12px;border:none;border-radius:8px;margin:5px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Rekap Absensi</h2>
<button onclick="exportCSV()" style="background:#22c55e">Export CSV</button>
<button onclick="hapus()" style="background:#ef4444;color:white">Hapus Semua</button>
<a href="index.html"><button style="background:#334155;color:white">Kembali</button></a>
<table id="tabel"><thead><tr><th>Tgl</th><th>Jam</th><th>Nama</th><th>Kelas</th><th>Status</th></tr></thead><tbody></tbody></table>
</div>
<script>
if(prompt('Password Admin:')!=='admin123'){location.href='index.html'}
function tampil(){
let data=JSON.parse(localStorage.getItem('absensi')||'[]');
let tb=document.querySelector('#tabel tbody');tb.innerHTML='';
for(let i=data.length-1;i>=0;i--){
let d=data[i];tb.innerHTML+='<tr><td>'+d.tanggal+'</td><td>'+d.jam+'</td><td>'+d.nama+'</td><td>'+d.kelas+'</td><td>'+d.status+'</td></tr>';
}}
tampil();
function exportCSV(){
let data=JSON.parse(localStorage.getItem('absensi')||'[]');
let csv='Tanggal,Jam,Nama,Kelas,Status\n';
for(let d of data){csv+=d.tanggal+','+d.jam+','+d.nama+','+d.kelas+','+d.status+'\n'}
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rekap.csv';a.click();
}
function hapus(){if(confirm('Hapus?')){localStorage.removeItem('absensi');tampil()}}
</script>
</body>
</html>
