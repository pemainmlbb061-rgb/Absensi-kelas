<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Kelas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:white;display:flex;justify-content:center;padding:20px;min-height:100vh}
.card{background:#1e293b;padding:28px;border-radius:20px;width:100%;max-width:420px}
h1{text-align:center;margin-bottom:10px}
#clock{text-align:center;background:#0f172a;padding:10px;border-radius:10px;margin:12px 0;font-weight:bold}
input,select{width:100%;padding:14px;border-radius:10px;border:none;margin:8px 0}
button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:white;font-weight:700;margin-top:10px}
#msg{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>📚 Absensi</h1>
<div id="clock">00:00 WIB</div>
<input id="nama" placeholder="Nama Lengkap">
<select id="kelas"><option value="">Pilih Kelas</option><option>X-A</option><option>X-B</option><option>XI-A</option><option>XII-A</option></select>
<button id="btn">ABSEN MASUK</button>
<p id="msg"></p>
<a href="admin.html" style="display:block;text-align:center;margin-top:15px;color:#93c5fd;font-size:13px">Ke Halaman Admin</a>
</div>
<script>
setInterval(function(){document.getElementById('clock').innerText=new Date().toLocaleTimeString('id-ID')+' WIB'},1000);
document.getElementById('btn').onclick=function(){
let n=document.getElementById('nama').value;
let k=document.getElementById('kelas').value;
if(!n||!k){document.getElementById('msg').innerText='Isi nama kelas dulu!';return}
let now=new Date();
let jam=now.toLocaleTimeString('id-ID');
let tgl=now.toLocaleDateString('id-ID');
let s=(now.getHours()+now.getMinutes()/60<=7.5)?'Hadir':'Telat';
let data=JSON.parse(localStorage.getItem('absensi')||'[]');
data.push({nama:n,kelas:k,jam:jam,tanggal:tgl,status:s});
localStorage.setItem('absensi',JSON.stringify(data));
document.getElementById('msg').innerText='✅ Berhasil: '+s+' jam '+jam;
};
</script>
</body>
</html>
